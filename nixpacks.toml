# Used only if the Docker builder is turned off. Prefer the Dockerfile.
[phases.setup]
# Nixpacks' own nixpkgs snapshots stop at Node 24, so pin a nixpkgs commit that
# has nodejs_26 (nixos-unstable, 2026-11-21). Not build-tested: nothing builds
# with Nixpacks while railway.toml uses the Dockerfile.
nixpkgsArchive = "2786a2a72088ecf32aea5b3ec52099e6a7cff78f"
nixPkgs = ["nodejs_26"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node build/index.js"
